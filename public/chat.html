<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Chat · Puesto de mando</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icono.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="chat-envoltura">

  <header class="cabecera">
    <div style="flex:1;min-width:0">
      <div class="marca" id="tituloChat">Puesto de mando</div>
      <div class="sub">
        <span id="miNombre">—</span> · <span id="miCodigo">—</span>
        <span class="conexion muerta" id="estadoConexion">conectando</span>
      </div>
    </div>
    <button type="button" class="boton secundario chico" id="btnEstado"
            aria-expanded="false" aria-controls="panelEstado">Mi estado</button>
  </header>

  <!-- Paneles plegables.
       max-height + scroll propio: son mas altos que un movil pequeno, y sin
       esto aplastarian la lista de mensajes.
       Cada uno se cierra por tres caminos (la X, el boton que lo abrio y la
       tecla Escape) porque en la primera version solo existia el tercero y la
       gente se quedaba encerrada en el panel sin encontrar la salida. -->

  <section id="panelEstado" class="panel-plegable tarjeta" hidden aria-labelledby="tituloEstado">
    <div class="panel-cabecera">
      <h2 id="tituloEstado">¿Como estas ahora?</h2>
      <button type="button" class="cerrar-panel" data-cierra="panelEstado" aria-label="Cerrar">&times;</button>
    </div>
    <div class="estados" id="listaEstados"></div>
    <label class="campo" style="margin-top:1rem">
      <span class="etiqueta">¿Que necesitas?</span>
      <span class="chips" id="listaNecesidades"></span>
    </label>
    <label class="campo">
      <span class="etiqueta">¿Donde estas?</span>
      <textarea id="campoUbicacion" placeholder="Direccion o punto de referencia"></textarea>
    </label>
    <button type="button" class="boton" id="btnGuardarEstado">Guardar y avisar al puesto</button>
  </section>

  <!-- El GPS tiene panel propio y boton propio en la barra de escritura.
       Antes vivia enterrado dentro de "Mi estado": mandar la ubicacion es de
       las cosas mas utiles que puede hacer la persona y estaba a tres toques
       de distancia, detras de un boton que no la nombraba. -->
  <section id="panelGps" class="panel-plegable tarjeta" hidden aria-labelledby="tituloGps">
    <div class="panel-cabecera">
      <h2 id="tituloGps">Enviar mi ubicacion</h2>
      <button type="button" class="cerrar-panel" data-cierra="panelGps" aria-label="Cerrar">&times;</button>
    </div>
    <p style="color:var(--texto-suave);font-size:.92rem;margin-top:0">
      Con tu ubicacion exacta la brigada llega directo, sin ir preguntando.
    </p>
    <div id="zonaGpsChat"></div>
  </section>

  <!-- Aviso de mini-navegador: solo aparece si estamos en la ventanita del
       portal cautivo, que puede cerrarse sola -->
  <div id="zonaNavegador" style="padding:0 .75rem"></div>

  <div class="chat-lista" id="listaMensajes">
    <div class="burbuja sistema">Cargando tus mensajes...</div>
  </div>

  <p class="nota-uso">
    Puesto de mando de emergencia · escribe solo informacion verdadera ·
    todo queda registrado
  </p>

  <form class="chat-barra" id="formMensaje">
    <button type="button" class="boton secundario boton-ubicacion" id="btnUbicacion"
            aria-expanded="false" aria-controls="panelGps" title="Enviar mi ubicacion">
      <span aria-hidden="true">📍</span>
      <span class="etiqueta-ubicacion">Ubicacion</span>
    </button>
    <textarea id="campoMensaje" rows="1" placeholder="Escribe aqui..." enterkeyhint="send"></textarea>
    <button type="submit" class="boton" id="btnEnviar">Enviar</button>
  </form>

</div>

<script src="/js/gps-enlace.js"></script>
<script src="/js/navegador.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
